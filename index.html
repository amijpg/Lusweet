<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lusweet | Dulcería</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDE1F0;
    --card-bg:#FFFBFD;
    --line-light:#EBACCB;
    --rose:#8e002b;
    --maroon:#8e002b;
    --text:#5A2536;
  }
  *{box-sizing:border-box;margin:0px;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    font-family:'Jost', sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  .flourish{
    position:absolute;
    opacity:.35;
    z-index:0;
  }
  .flourish svg{ width:100%; height:100%; display:block; }
  .flourish-1{ width:220px; height:220px; top:-60px; left:-70px; transform:rotate(-15deg); }
  .flourish-2{ width:200px; height:200px; bottom:-50px; right:-60px; transform:rotate(160deg); }
  .flourish-3{ width:150px; height:150px; bottom:40%; right:-90px; opacity:.2; transform:rotate(40deg); }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:28px;
    padding:46px 32px 36px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(116,50,54,0.25);
    position:relative;
    z-index:1;
  }

  .monogram{
    font-family:'Cormorant Garamond', serif;
    font-size:44px;
    color:var(--rose);
    line-height:1;
    margin-bottom:6px;
    position:relative;
    z-index:1;
    width:84px;
    height:84px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--rose-deep), var(--rose));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px -6px #8e002b;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:44px;
    color:var(--rose);
    line-height:1;
    margin-top:4px;
  }

  h1 img{
    width: 200px;
  }

  .tagline{
    font-size:14px;
    letter-spacing:1px;
    text-transform:lowercase;
    color:var(--maroon);
    opacity:.8;
    margin-top:8px;
    margin-bottom:20px;
  }

  .divider{
    width:56px;
    height:1px;
    background:var(--rose);
    margin:0 auto 30px;
    opacity:.5;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    padding:16px 20px;
    border-radius:16px;
    background:var(--bg);
    border:1px solid var(--line-light);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn:hover{ transform:translateY(-2px); box-shadow:0 10px 20px -12px rgba(116,50,54,0.35); }
  .btn:active{ transform:translateY(0); }

  .btn .icon{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--card-bg);
    border:1.5px solid var(--maroon);
  }

  .btn .icon svg{ width:19px; height:19px; display:block; }

  .btn .label{ text-align:left; }
  .btn .label small{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--rose);
    font-weight:600;
    margin-bottom:2px;
  }
  .btn .label span{
    font-size:15px;
    color:var(--text);
  }

  footer{
    margin-top:30px;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--rose);
    opacity:.7;
  }
</style>
</head>
